[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplecalc"
version = "0.1.0"
description = "Simple calculator program"
requires-python = ">=3.9"
dependencies = []

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 5

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
